name: SILK macOS universal
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure universal
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DSILK_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4 -- -quiet
      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          ./build/Release/silk_engine_tests 2>&1 | tee engine-test-log.txt
      - name: Plugin tests (JUCE processor + editor screenshots)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p shots && cd shots
          ../build/silk_plugin_tests_artefacts/Release/silk_plugin_tests 2>&1 | tee ../plugin-test-log.txt
      - name: Strip, sign, verify universal
        shell: bash
        run: |
          set -e
          for b in "build/Silk_artefacts/Release/VST3/SILK.vst3" "build/Silk_artefacts/Release/AU/SILK.component"; do
            strip -x "$b/Contents/MacOS/SILK"
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --deep --strict "$b"
            lipo -info "$b/Contents/MacOS/SILK" | tee -a lipo.txt
            lipo "$b/Contents/MacOS/SILK" -verify_arch arm64 x86_64
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$b/Contents/Info.plist" | tee -a version.txt
          done
      - name: pluginval VST3 strictness 10 (required)
        shell: bash
        run: |
          set -o pipefail
          curl -fLsS -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 "build/Silk_artefacts/Release/VST3/SILK.vst3" 2>&1 | tee pluginval-vst3-log.txt
      - name: auval + pluginval AU (required)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Silk_artefacts/Release/AU/SILK.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a 2>&1 | grep -i -E "Silk|SILK" | tee auval-list.txt
          auval -strict -v aufx Silk Koob 2>&1 | tee auval-log.txt
          grep -q "AU VALIDATION SUCCEEDED" auval-log.txt
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 ~/Library/Audio/Plug-Ins/Components/SILK.component 2>&1 | tee pluginval-au-log.txt
      - name: Package
        if: success()
        run: |
          mkdir -p pkg/SILK
          cp -R build/Silk_artefacts/Release/VST3/SILK.vst3 build/Silk_artefacts/Release/AU/SILK.component pkg/SILK/
          cp scripts/install_mac.sh scripts/INSTALL.txt README.md TESTING.md pkg/SILK/
          chmod +x pkg/SILK/install_mac.sh
          cd pkg && zip -9 -r -y -q "$GITHUB_WORKSPACE/SILK-macOS-universal-v1.0.zip" SILK
          shasum -a 256 "$GITHUB_WORKSPACE/SILK-macOS-universal-v1.0.zip" | tee "$GITHUB_WORKSPACE/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SILK-macOS-universal-v1.0
          path: |
            SILK-macOS-universal-v1.0.zip
            shots/*.png
            engine-test-log.txt
            plugin-test-log.txt
            pluginval-vst3-log.txt
            pluginval-au-log.txt
            auval-log.txt
            auval-list.txt
            lipo.txt
            version.txt
            sha256.txt
